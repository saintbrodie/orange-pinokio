name: Prune old ChatGPT branches

on:
  push:
    branches: [main]
    paths:
      - .github/workflows/prune-chatgpt-branches.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - name: Delete stale feature branches
        uses: actions/github-script@v7
        with:
          script: |
            const branches = [
              'chatgpt/hardware-aware-packs',
              'chatgpt/orange-starter-stack'
            ];
            for (const branch of branches) {
              try {
                await github.rest.git.deleteRef({
                  owner: context.repo.owner,
                  repo: context.repo.repo,
                  ref: `heads/${branch}`,
                });
                core.info(`Deleted ${branch}`);
              } catch (error) {
                if (error.status === 404 || error.status === 422) {
                  core.info(`Skipped ${branch}: ${error.message}`);
                } else {
                  throw error;
                }
              }
            }
