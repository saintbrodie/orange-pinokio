name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Check launcher JavaScript syntax
        run: |
          node --check install.js
          node --check install-managed.js
          node --check install-orange.js
          node --check start.js
          node --check update.js
          node --check update-comfyui.js
          node --check update-comfyui-latest.js
          node --check rollback-comfyui.js
          node --check scripts/comfy-runtime.js
          node --check reset.js
          node --check pinokio.js

      - name: Verify fresh installs require an explicit mode choice
        run: |
          node <<'NODE'
          const launcher = require('./pinokio.js')
          const info = {
            exists: () => false,
            running: () => false,
            local: () => null,
          }
          launcher.menu({}, info).then((items) => {
            if (items.length !== 2) throw new Error(`Expected 2 install choices, got ${items.length}`)
            const hrefs = items.map((item) => item.href).sort()
            if (hrefs.join(',') !== 'install-managed.js,install-orange.js') {
              throw new Error(`Unexpected install choices: ${hrefs.join(',')}`)
            }
            if (items.some((item) => item.default)) {
              throw new Error('Fresh install choices must not set a Pinokio default')
            }
          })
          NODE

      - name: Verify incomplete managed installs are recoverable
        run: |
          node <<'NODE'
          const launcher = require('./pinokio.js')
          const paths = new Set(['env', 'app', 'comfyui/ComfyUI'])
          const info = {
            exists: (path) => paths.has(path),
            running: () => false,
            local: () => null,
          }
          launcher.menu({}, info).then((items) => {
            const finish = items.find((item) => item.href === 'install-managed.js')
            if (!finish || !/Finish Orange \+ ComfyUI Install/.test(finish.text)) {
              throw new Error('Incomplete managed installs must offer a managed repair path')
            }
            if (items.some((item) => item.default)) {
              throw new Error('Incomplete install recovery must not auto-run a choice')
            }
          })
          NODE

      - name: Verify managed venv paths are app-root relative
        run: |
          node <<'NODE'
          const fs = require('fs')
          const files = ['install-managed.js', 'update-comfyui.js', 'update-comfyui-latest.js', 'rollback-comfyui.js']
          for (const file of files) {
            const source = fs.readFileSync(file, 'utf8')
            if (!source.includes('venv: "comfy-env"')) throw new Error(`${file} must use the app-root comfy-env`)
            if (source.includes('../../comfy-env')) throw new Error(`${file} must not use traversal in the Pinokio venv field`)
          }
          const managed = fs.readFileSync('install-managed.js', 'utf8')
          if (!managed.includes('/whl/cu130') || !managed.includes('/whl/cu128')) throw new Error('Managed installer must include CUDA 13.0 and 12.8 routes')
          if (!managed.includes('--extra-index-url')) throw new Error('PyTorch install must keep PyPI available for dependencies')
          NODE

      - name: Verify legacy nested Mac ComfyUI installs stay usable
        run: |
          node <<'NODE'
          const launcher = require('./pinokio.js')
          const paths = new Set(['env', 'app', 'comfyui/ComfyUI', 'comfyui/ComfyUI/comfy-env'])
          const info = {
            exists: (path) => paths.has(path),
            running: () => false,
            local: () => null,
          }
          launcher.menu({}, info).then((items) => {
            const start = items.find((item) => item.href === 'start.js')
            if (!start || start.text !== 'Start Orange + ComfyUI') {
              throw new Error('Legacy nested ComfyUI venv must still be recognized as managed')
            }
          })
          const startScript = require('fs').readFileSync('start.js', 'utf8')
          if (!startScript.includes("legacy_comfy_py")) throw new Error('start.js must retain the nested Mac venv fallback')
          NODE

      - name: Verify Windows auto-install shim cannot choose a mode
        run: |
          node <<'NODE'
          const fs = require('fs')
          const chooser = fs.readFileSync('install.js', 'utf8')
          if (/git clone|pip install|ComfyUI\.git/.test(chooser)) {
            throw new Error('install.js must remain a chooser-only shim; Windows may auto-run it')
          }
          NODE

      - name: Verify Orange WebUI is only exposed after readiness
        run: |
          node <<'NODE'
          const fs = require('fs')
          const start = fs.readFileSync('start.js', 'utf8')
          const ready = start.indexOf('wait_for_orange(orange)')
          const exposed = start.indexOf("print('ORANGE_URL=' + orange_url")
          if (ready < 0 || exposed < 0 || ready > exposed) {
            throw new Error('start.js must wait for Orange HTTP readiness before exposing ORANGE_URL to Pinokio')
          }
          if (!start.includes('urllib.request.urlopen')) {
            throw new Error('start.js must probe the Orange HTTP endpoint before setting the Pinokio WebUI URL')
          }
          NODE

      - name: Verify managed ComfyUI lifecycle is explicit
        run: |
          node <<'NODE'
          const fs = require('fs')
          const update = fs.readFileSync('update.js', 'utf8')
          if (update.includes('path: "comfyui/ComfyUI"') && update.includes('git pull --ff-only')) {
            throw new Error('Update Orange must not implicitly update ComfyUI')
          }
          const install = fs.readFileSync('install-managed.js', 'utf8')
          if (!install.includes('Comfy-Org/ComfyUI.git')) throw new Error('Managed install must use the canonical ComfyUI repository')
          if (!install.includes('pin-tested --initial')) throw new Error('Fresh managed installs must pin the Orange-tested ComfyUI revision')
          const helper = fs.readFileSync('scripts/comfy-runtime.js', 'utf8')
          for (const action of ['pin-tested', 'latest', 'rollback', 'adopt']) {
            if (!helper.includes(action)) throw new Error(`Missing ComfyUI runtime action: ${action}`)
          }
          const start = fs.readFileSync('start.js', 'utf8')
          if (!start.includes('ORANGE_COMFYUI_STATE') || !start.includes('ORANGE_MANAGED_COMFYUI_URL')) {
            throw new Error('Orange must receive managed ComfyUI lifecycle state on start')
          }
          NODE

      - name: Verify managed menu exposes safe and advanced update paths
        run: |
          node <<'NODE'
          const launcher = require('./pinokio.js')
          const paths = new Set(['env', 'app', 'comfyui/ComfyUI', 'comfy-env', 'runtime/comfyui-rollback-available'])
          const info = {
            exists: (path) => paths.has(path),
            running: () => false,
            local: () => null,
          }
          launcher.menu({}, info).then((items) => {
            const hrefs = new Set(items.map(item => item.href))
            for (const required of ['update.js', 'update-comfyui.js', 'update-comfyui-latest.js', 'rollback-comfyui.js']) {
              if (!hrefs.has(required)) throw new Error(`Managed menu missing ${required}`)
            }
            const orangeUpdate = items.find(item => item.href === 'update.js')
            if (!orangeUpdate || orangeUpdate.text !== 'Update Orange') throw new Error('Normal update action must be clearly Orange-only')
          })
          NODE

      - name: Validate Pinokio metadata JSON
        run: node -e "JSON.parse(require('fs').readFileSync('pinokio.json', 'utf8'))"
